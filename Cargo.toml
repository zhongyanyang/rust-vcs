[package]
name = "myvcs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[[bin]]
name = "myvcs"
path = "main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
fs2 = "0.4"
libc = "0.2"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
walkdir = "2"
